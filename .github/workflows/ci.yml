name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-frontend-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Python compile smoke test
        run: |
          python -m py_compile backend/main.py backend/config.py backend/api/routes/admin.py backend/api/routes/user.py backend/api/routes/market.py backend/api/routes/beta.py backend/core/user_rate_limiter.py backend/data/storage/supabase_client.py

      - name: Run backend smoke tests
        run: pytest -q tests/test_free_beta_smoke.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build
